/* ===== Base ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f8ff;
    color:#222;
}


/* ===== Premium Navbar ===== */

header{
    width:90%;
    margin:20px auto;

    padding:16px 28px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,.82);
    backdrop-filter:blur(18px);

    border:1px solid #e2eaff;
    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

    position:sticky;
    top:20px;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#123c8c,#4f8cff);
    color:white;

    border-radius:16px;
    font-size:21px;

    box-shadow:0 8px 20px rgba(18,60,140,.2);
}

.logo h2{
    color:#123c8c;
    font-size:22px;
}

nav{
    display:flex;
    gap:8px;
}

nav a{
    text-decoration:none;
    color:#333;

    font-weight:600;
    padding:10px 16px;

    border-radius:22px;
    transition:.3s;
}

nav a:hover{
    background:#123c8c;
    color:white;
}


/* ===== Hero ===== */

.hero{
    position:relative;
    overflow:hidden;

    padding:80px 8%;

    background:linear-gradient(
        135deg,
        #eaf3ff,
        #ffffff
    );
}

.hero::before{
    content:"";

    position:absolute;

    width:320px;
    height:320px;

    background:#dbe9ff;
    border-radius:50%;

    right:-120px;
    top:-120px;

    opacity:.6;
}

.hero-content{
    position:relative;
    z-index:2;

    max-width:1000px;
    margin:auto;

    text-align:center;
}

.badge{
    display:inline-block;

    padding:10px 18px;
    margin-bottom:20px;

    background:#e8f1ff;
    color:#123c8c;

    border:1px solid #d5e4ff;
    border-radius:30px;

    font-size:14px;
    font-weight:700;
}

.hero h1{
    font-size:52px;
    color:#102a6b;
    line-height:1.15;
    margin-bottom:18px;
}

.hero p{
    max-width:700px;
    margin:auto;

    color:#606b7c;
    font-size:18px;
    line-height:1.7;
}
